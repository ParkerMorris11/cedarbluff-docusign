<text x="730.0" y="342" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1E2A4A" text-anchor="middle" >through the service</text>
<text x="730.0" y="402" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="600" fill="#5B6475" text-anchor="middle" >useLoad(() =&gt;</text>
<text x="730.0" y="430" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="600" fill="#5B6475" text-anchor="middle" >getForUser())</text>
<text x="730.0" y="492" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E9E5B" text-anchor="middle" >no copy kept</text>
<rect x="960" y="281" width="230" height="180" rx="24" fill="#EDF0F6" stroke="#1E2A4A" stroke-width="4" />
<text x="1075.0" y="362" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#1E2A4A" text-anchor="middle" >Envelope</text>
<text x="1075.0" y="398" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#1E2A4A" text-anchor="middle" >Service</text>
<rect x="1280" y="206" width="260" height="330" rx="24" fill="#E7F5EC" stroke="#2E9E5B" stroke-width="5" />
