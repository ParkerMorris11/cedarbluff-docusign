<rect x="295" y="426" width="175" height="48" rx="24" fill="#E3F4F3" stroke="#0F8F8C" stroke-width="2"/>
<text x="382.5" y="458" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F8F8C" text-anchor="middle" >Parker Morris</text>
<text x="110" y="518" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#5B6475" text-anchor="start" >seeded users (src/domain/seed.ts)</text>
<rect x="590" y="206" width="280" height="330" rx="24" fill="#FFFFFF" stroke="#2F6FED" stroke-width="4" />
<text x="730.0" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#2F6FED" text-anchor="middle" >Screens</text>
