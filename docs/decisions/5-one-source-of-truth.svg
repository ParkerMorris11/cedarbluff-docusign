<rect x="330" y="620" width="340" height="120" rx="20" fill="#F6F8FB" stroke="#AEB6C3" stroke-width="3" />
<text x="500" y="672" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#5B6475" text-anchor="middle" >Zustand</text>
<text x="500" y="708" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#5B6475" text-anchor="middle" >envelopes[ ] copy</text>
<rect x="930" y="620" width="340" height="120" rx="20" fill="#F6F8FB" stroke="#AEB6C3" stroke-width="3" />
<text x="1100" y="672" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#5B6475" text-anchor="middle" >Repository</text>
<text x="1100" y="708" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#5B6475" text-anchor="middle" >envelopes</text>
<text x="800" y="698" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#5B6475" text-anchor="middle" >≠</text>
</g>
