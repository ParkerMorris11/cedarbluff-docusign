<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">One source of truth</title>
<desc id="desc">Zustand holds only the current user (four seeded users). Screens load envelopes through EnvelopeService from the repository, the only place envelopes live. Crossed out: envelopes cached in Zustand too, two copies that drift.</desc>
<defs>
  <marker id="a-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E2A4A"/></marker>
  <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D64545"/></marker>
  <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E9E5B"/></marker>
  <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FED"/></marker>
  <marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8F8C"/></marker>
  <marker id="a-fade" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#AEB6C3"/></marker>
</defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#1E2A4A" text-anchor="start" >One source of truth</text>
<text x="80" y="146" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6475" text-anchor="start" >Zustand only remembers who you are. Envelopes are read fresh from the repository.</text>
<rect x="80" y="206" width="400" height="330" rx="24" fill="#FFFFFF" stroke="#0F8F8C" stroke-width="4" />
<text x="110" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0F8F8C" text-anchor="start" >Zustand</text>
<text x="110" y="296" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E2A4A" text-anchor="start" >current user only</text>
<text x="110" y="328" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="600" fill="#5B6475" text-anchor="start" >useCurrentUserStore → userId</text>
<rect x="110" y="362" width="175" height="48" rx="24" fill="#E3F4F3" stroke="#0F8F8C" stroke-width="2"/>
<text x="197.5" y="394" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F8F8C" text-anchor="middle" >Alex Rivera</text>
<rect x="295" y="362" width="175" height="48" rx="24" fill="#E3F4F3" stroke="#0F8F8C" stroke-width="2"/>
<text x="382.5" y="394" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F8F8C" text-anchor="middle" >Sam Chen</text>
<rect x="110" y="426" width="175" height="48" rx="24" fill="#E3F4F3" stroke="#0F8F8C" stroke-width="2"/>
