<text x="1410.0" y="324" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E2A4A" text-anchor="middle" >the only place</text>
<text x="1410.0" y="358" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E2A4A" text-anchor="middle" >envelopes live</text>
<circle cx="1410.0" cy="436" r="30" fill="#2E9E5B"/><path d="M1396.5 436.6 L1407.0 447.4 L1425.0 425.5" fill="none" stroke="#fff" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="486" y1="371" x2="578" y2="371" stroke="#0F8F8C" stroke-width="5" marker-end="url(#a-teal)"/>
<text x="535.0" y="356" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F8F8C" text-anchor="middle" >who am I?</text>
<line x1="876" y1="371" x2="948" y2="371" stroke="#1E2A4A" stroke-width="5" marker-end="url(#a-navy)"/>
<line x1="1196" y1="371" x2="1268" y2="371" stroke="#1E2A4A" stroke-width="5" marker-end="url(#a-navy)"/>
