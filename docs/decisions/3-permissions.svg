<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The door and the lock</title>
<desc id="desc">The UI hides buttons using canEditField and canEditLayout. A bug or pasted URL skips the UI, but both paths reach EnvelopeService, which re-checks canView, canEditLayout, canEditField and transition. The side path ends in &#x27;Envelope not found&#x27;.</desc>
<defs>
  <marker id="a-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E2A4A"/></marker>
  <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D64545"/></marker>
  <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E9E5B"/></marker>
  <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FED"/></marker>
  <marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8F8C"/></marker>
  <marker id="a-fade" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#AEB6C3"/></marker>
</defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#1E2A4A" text-anchor="start" >The door and the lock</text>
<text x="80" y="146" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6475" text-anchor="start" >Hiding a button is the door. The real lock is in the service, so every path hits it.</text>
<rect x="80" y="210" width="420" height="250" rx="24" fill="#FFFFFF" stroke="#2F6FED" stroke-width="4" />
<rect x="110" y="262" width="70.0" height="110.0" rx="6.0" fill="#EAF1FE" stroke="#2F6FED" stroke-width="4"/><rect x="122.0" y="276.0" width="46.0" height="34.0" rx="4" fill="none" stroke="#2F6FED" stroke-width="3"/><rect x="122.0" y="322.0" width="46.0" height="36.0" rx="4" fill="none" stroke="#2F6FED" stroke-width="3"/><circle cx="166.0" cy="318.0" r="5.0" fill="#2F6FED"/>
<text x="210" y="270" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#2F6FED" text-anchor="start" >The door: the UI</text>
<text x="210" y="312" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#5B6475" text-anchor="start" >hides buttons</text>
<text x="210" y="356" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="600" fill="#1E2A4A" text-anchor="start" >canEditField()</text>
<text x="210" y="390" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="600" fill="#1E2A4A" text-anchor="start" >canEditLayout()</text>
<text x="110" y="432" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#5B6475" text-anchor="start" >components/FillView, EnvelopePage</text>
<rect x="80" y="590" width="420" height="170" rx="24" fill="#FCECEC" stroke="#D64545" stroke-width="4" stroke-dasharray="12 9" />
<text x="290" y="650" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#D64545" text-anchor="middle" >Side path</text>
<text x="290" y="694" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#D64545" text-anchor="middle" >bug or pasted URL</text>
<text x="290" y="730" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5B6475" text-anchor="middle" >skips the hidden buttons</text>
<rect x="640" y="250" width="470" height="470" rx="28" fill="#EDF0F6" stroke="#1E2A4A" stroke-width="5" />
<text x="875.0" y="308" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#1E2A4A" text-anchor="middle" >EnvelopeService</text>
<path d="M855.0 365.0 V347.5 a20.0 20.0 0 0 1 40.0 0 V365.0" fill="none" stroke="#1E2A4A" stroke-width="8.75"/><rect x="840.0" y="365.0" width="70.0" height="55.0" rx="10.0" fill="#1E2A4A"/><circle cx="875.0" cy="389.75" r="6.25" fill="#fff"/>
<text x="875.0" y="478" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#1E2A4A" text-anchor="middle" >Are you allowed?</text>
<text x="875.0" y="516" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#5B6475" text-anchor="middle" >re-checked on every call:</text>
<text x="875.0" y="562" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="600" fill="#1E2A4A" text-anchor="middle" >canView()</text>
<text x="875.0" y="600" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="600" fill="#1E2A4A" text-anchor="middle" >canEditLayout()</text>
<text x="875.0" y="638" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="600" fill="#1E2A4A" text-anchor="middle" >canEditField()</text>
<text x="875.0" y="676" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="600" fill="#1E2A4A" text-anchor="middle" >transition()</text>
<text x="875.0" y="756" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5B6475" text-anchor="middle" >rules live in src/domain/envelope.ts</text>
<path d="M500 335 L628 335" fill="none" stroke="#2F6FED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<path d="M500 675 C 570 675, 570 620, 628 620" fill="none" stroke="#D64545" stroke-width="5" stroke-dasharray="12 9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/>
<path d="M1110 335 L1238 335" fill="none" stroke="#2E9E5B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/>
<rect x="1250" y="280" width="290" height="110" rx="24" fill="#E7F5EC" stroke="#2E9E5B" stroke-width="4" />
<circle cx="1292" cy="335" r="22" fill="#2E9E5B"/><path d="M1282.1 335.44 L1289.8 343.36 L1303.0 327.3" fill="none" stroke="#fff" stroke-width="4.84" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1326" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2E9E5B" text-anchor="start" >allowed:</text>
<text x="1326" y="362" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2E9E5B" text-anchor="start" >change saved</text>
<path d="M1110 620 L1238 620" fill="none" stroke="#D64545" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/>
<rect x="1250" y="548" width="290" height="150" rx="24" fill="#FCECEC" stroke="#D64545" stroke-width="4" />
<circle cx="1292" cy="600" r="22" fill="#D64545"/><path d="M1283.64 591.64 L1300.36 608.36 M1300.36 591.64 L1283.64 608.36" stroke="#fff" stroke-width="4.84" stroke-linecap="round"/>
<text x="1326" y="594" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#D64545" text-anchor="start" >“Envelope</text>
<text x="1326" y="628" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#D64545" text-anchor="start" >not found”</text>
<text x="1270" y="676" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5B6475" text-anchor="start" >or a DomainError</text>
</svg>
