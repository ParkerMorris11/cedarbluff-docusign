<text x="80" y="146" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6475" text-anchor="start" >hash = sha256(prevHash + entry). Change one entry and its hash no longer matches.</text>
