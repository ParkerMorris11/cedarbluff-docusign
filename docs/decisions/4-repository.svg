<rect x="1210" y="214" width="310" height="230" rx="24" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="4" />
<rect x="1212" y="216" width="306" height="72" rx="22" fill="#E7F5EC"/>
<rect x="1212" y="254" width="306" height="34" fill="#E7F5EC"/>
<text x="1365.0" y="264" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" fill="#2E9E5B" text-anchor="middle" >localStorage</text>
<text x="1365.0" y="348" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" font-weight="600" fill="#5B6475" text-anchor="middle" >minisign.envelopes.v1</text>
