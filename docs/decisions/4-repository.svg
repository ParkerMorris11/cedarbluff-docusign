<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">One helper for saving</title>
<desc id="desc">Screens to EnvelopeService to EnvelopeRepository (list, get, put, all async) to localStorage. A dashed real server box can swap in at the repository. Faded alternative: screens touch localStorage directly, marked wrong.</desc>
<defs>
  <marker id="a-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E2A4A"/></marker>
  <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D64545"/></marker>
  <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E9E5B"/></marker>
  <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FED"/></marker>
  <marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8F8C"/></marker>
  <marker id="a-fade" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#AEB6C3"/></marker>
</defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="80" y="98" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#1E2A4A" text-anchor="start" >One helper for saving</text>
<text x="80" y="146" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6475" text-anchor="start" >Screens never touch storage. They go through the service, which uses the repository.</text>
<rect x="80" y="214" width="250" height="230" rx="24" fill="#FFFFFF" stroke="#2F6FED" stroke-width="4" />
<rect x="82" y="216" width="246" height="72" rx="22" fill="#EAF1FE"/>
<rect x="82" y="254" width="246" height="34" fill="#EAF1FE"/>
