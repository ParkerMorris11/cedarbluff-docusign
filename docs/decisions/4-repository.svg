<text x="205.0" y="348" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" font-weight="600" fill="#5B6475" text-anchor="middle" >src/components</text>
<rect x="400" y="214" width="290" height="230" rx="24" fill="#FFFFFF" stroke="#1E2A4A" stroke-width="4" />
<rect x="402" y="216" width="286" height="72" rx="22" fill="#EDF0F6"/>
<rect x="402" y="254" width="286" height="34" fill="#EDF0F6"/>
<text x="545.0" y="264" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" font-weight="800" fill="#1E2A4A" text-anchor="middle" >EnvelopeService</text>
<text x="545.0" y="348" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#5B6475" text-anchor="middle" >checks rules</text>
<rect x="760" y="214" width="380" height="230" rx="24" fill="#FFFFFF" stroke="#0F8F8C" stroke-width="4" />
