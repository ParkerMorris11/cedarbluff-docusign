<text x="800" y="372" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="600" fill="#1E2A4A" text-anchor="start" >get(id)</text>
<text x="800" y="406" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="23" font-weight="600" fill="#1E2A4A" text-anchor="start" >put(envelope)</text>
<rect x="1010" y="324" width="108" height="40" rx="20.0" fill="#0F8F8C"/><text x="1064.0" y="351.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" >async</text>
<text x="1064" y="392" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="600" fill="#5B6475" text-anchor="middle" >Promise</text>
<line x1="336" y1="329.0" x2="388" y2="329.0" stroke="#1E2A4A" stroke-width="5" marker-end="url(#a-navy)"/>
<line x1="696" y1="329.0" x2="748" y2="329.0" stroke="#1E2A4A" stroke-width="5" marker-end="url(#a-navy)"/>
<line x1="1146" y1="329.0" x2="1198" y2="329.0" stroke="#1E2A4A" stroke-width="5" marker-end="url(#a-navy)"/>
<rect x="1210" y="560" width="310" height="130" rx="24" fill="#FFFFFF" stroke="#2F6FED" stroke-width="4" stroke-dasharray="12 9" />
<text x="1365" y="616" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#2F6FED" text-anchor="middle" >real server later</text>
<text x="1365" y="654" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#5B6475" text-anchor="middle" >same list / get / put</text>
<path d="M950 450 C 950 625, 1100 625, 1196 625" fill="none" stroke="#2F6FED" stroke-width="4" stroke-dasharray="12 9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<text x="930" y="560" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#2F6FED" text-anchor="end" >swap in here</text>
<text x="1365" y="730" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5B6475" text-anchor="middle" >wired in src/app/services.ts</text>
<g opacity="0.55">
<rect x="80" y="560" width="600" height="220" rx="24" fill="#F6F8FB" stroke="#AEB6C3" stroke-width="3" stroke-dasharray="10 8" />
<rect x="120" y="640" width="180" height="80" rx="16" fill="#FFFFFF" stroke="#AEB6C3" stroke-width="3" />
<text x="210" y="690" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#5B6475" text-anchor="middle" >Screens</text>
<rect x="440" y="640" width="200" height="80" rx="16" fill="#FFFFFF" stroke="#AEB6C3" stroke-width="3" />
<text x="540" y="690" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#5B6475" text-anchor="middle" >localStorage</text>
<line x1="306" y1="680" x2="428" y2="680" stroke="#AEB6C3" stroke-width="4" marker-end="url(#a-fade)"/>
</g>
<circle cx="678" cy="562" r="24" fill="#D64545"/><path d="M668.88 552.88 L687.12 571.12 M687.12 552.88 L668.88 571.12" stroke="#fff" stroke-width="5.28" stroke-linecap="round"/>
<text x="110" y="612" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#D64545" text-anchor="start" >screens touch localStorage directly</text>
<text x="380" y="760" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#5B6475" text-anchor="middle" >every screen changes when storage does</text>
</svg>
